[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jira-codex-agent"
version = "0.1.0"
description = "A low-overhead macOS daemon that turns Jira issues into isolated Codex work sessions"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9", "pytest-asyncio>=0.23,<1", "respx>=0.21,<1"]

[project.scripts]
jira-codex-agent = "jira_codex_agent.cli.commands:app"

[tool.hatch.build.targets.wheel]
packages = ["src/jira_codex_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
